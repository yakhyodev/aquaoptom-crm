# ==============================================================================
# AquaOptom Wholesale Beverage CRM — Nginx Production Reverse Proxy
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Upstream PHP-FPM
    upstream php_fpm {
        server app:9000;
        keepalive 32;
    }

    # Upstream Reverb WebSockets
    upstream reverb_ws {
        server reverb:8080;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name crm.aquaoptom.uz localhost;

        # Redirect all HTTP traffic to HTTPS (in production)
        # return 301 https://$host$request_uri;

        root /var/www/html/public;
        index index.php;

        client_max_body_size 50M;

        # ======================================================================
        # Security Headers
        # ======================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ======================================================================
        # Private Storage & Hidden Files Protection (CRITICAL)
        # ======================================================================
        # Strictly forbid direct web access to private storage, backups, and dotfiles
        location ~ ^/storage/app/private/ {
            deny all;
            return 403;
        }

        location ~ ^/storage/backups/ {
            deny all;
            return 403;
        }

        location ~ /\. {
            deny all;
            return 403;
        }

        # Public uploaded assets
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Static build assets (Vite)
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # PWA Service Worker & Manifest
        location ~ ^/(sw\.js|manifest\.json)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # WebSockets (Laravel Reverb)
        location /app {
            proxy_pass http://reverb_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # API Login Rate Limit
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # Main Application Router
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM Handler
        location ~ \.php$ {
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }
}
