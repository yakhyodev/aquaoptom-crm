services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquaoptom_preview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?Preview DB password required}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d aquaoptom_preview]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  app:
    image: aquaoptom-preview:current
    env_file: ../backend/.env
    volumes:
      - preview_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: aquaoptom-preview-nginx:current
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./preview-nginx.conf:/etc/nginx/nginx.conf:ro
      - preview_storage:/var/www/html/storage:ro
    depends_on: [app, reverb]
  reverb:
    image: aquaoptom-preview:current
    env_file: ../backend/.env
    command: [php, artisan, "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on: [redis, app]
  worker:
    image: aquaoptom-preview:current
    env_file: ../backend/.env
    volumes:
      - preview_storage:/var/www/html/storage
    command: [php, artisan, "queue:work", "--sleep=3", "--tries=3"]
    depends_on: [app]
  outbox:
    image: aquaoptom-preview:current
    env_file: ../backend/.env
    volumes:
      - preview_storage:/var/www/html/storage
    command: [php, artisan, "app:process-outbox", --watch]
    depends_on: [app]

volumes:
  preview_storage:
