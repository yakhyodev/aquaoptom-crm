services:
  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
      - reverb
    networks:
      - aquaoptom_network

  # ============================================================================
  # PHP-FPM Web Application
  # ============================================================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_app
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aquaoptom_network

  # ============================================================================
  # Background Queue Worker
  # ============================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - aquaoptom_network

  # ============================================================================
  # Laravel Reverb WebSocket Server
  # ============================================================================
  reverb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    expose:
      - "8080"
    depends_on:
      - redis
    networks:
      - aquaoptom_network

  # ============================================================================
  # Outbox Event Dispatcher Daemon
  # ============================================================================
  outbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_outbox
    restart: unless-stopped
    command: ["php", "artisan", "app:process-outbox", "--watch"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - aquaoptom_network

  # ============================================================================
  # Scheduler / Task Runner
  # ============================================================================
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST}
    container_name: aquaoptom_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - aquaoptom_network

  # ============================================================================
  # PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aquaoptom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aquaoptom_prod}
      POSTGRES_USER: ${DB_USERNAME:-aquaoptom_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aquaoptom_user} -d ${DB_DATABASE:-aquaoptom_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquaoptom_network

  # ============================================================================
  # Redis 7 Cache & Queue Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: aquaoptom_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquaoptom_network

networks:
  aquaoptom_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_storage:
