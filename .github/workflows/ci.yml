name: AquaOptom CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-pwa:
    name: Backend, PostgreSQL, Redis & PWA tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aquaoptom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aquaoptom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: aquaoptom_test
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'
      TELEGRAM_BOT_TOKEN: fake_testing_bot_token
      TELEGRAM_CHANNEL_ID: '-1000000000000'

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, zip, redis
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Locate Composer download cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-php85-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php85-composer-

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env.testing
          mkdir -p test-results bootstrap/cache storage/framework/{cache/data,sessions,views,testing} storage/logs storage/app/{private,public}

      - name: Validate and install Composer dependencies
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate --env=testing --no-interaction

      - name: Install JavaScript dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"

      - name: Check PHP syntax
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || exit 1
          done < <(find app bootstrap config database routes tests -name '*.php' -print0)

      - name: Verify migrations, rollback and reference seeding
        run: |
          php artisan migrate --env=testing --force --no-interaction
          php artisan migrate:rollback --env=testing --force --no-interaction
          php artisan migrate --env=testing --force --no-interaction
          php artisan db:seed --class=RoleAndPermissionSeeder --env=testing --force --no-interaction

      # PHPUnit invokes both Node.js PWA suites; npm ci above is required.
      - name: Run backend and PWA tests
        run: php artisan test --env=testing --compact --log-junit=test-results/backend.xml 2>&1 | tee test-results/backend.log

      - name: Audit locked dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit

      - name: Verify Reverb WebSocket handshake
        env:
          REVERB_APP_ID: ci-app
          REVERB_APP_KEY: ci-public-key
          REVERB_APP_SECRET: ci-only-secret
        run: |
          php artisan reverb:start --host=127.0.0.1 --port=18080 > test-results/reverb.log 2>&1 &
          reverb_pid=$!
          trap 'kill "$reverb_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for attempt in range(20):
              try:
                  client = socket.create_connection(('127.0.0.1', 18080), timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise RuntimeError('Reverb did not start')
          with client:
              client.sendall(b'GET /app/ci-public-key?protocol=7&client=js&version=8.0.0 HTTP/1.1\r\nHost: 127.0.0.1:18080\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n')
              response = client.recv(4096)
              assert b'101 Switching Protocols' in response, response[:200]
          print('Reverb WebSocket handshake passed')
          PY

      - name: Save test results and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-test-results
          path: |
            backend/test-results/
            backend/storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  mobile-tests:
    name: Flutter analysis & offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install native SQLite for offline tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: |
          mkdir -p test-results
          flutter test --reporter expanded 2>&1 | tee test-results/flutter.log

      - name: Save Flutter test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: flutter-test-results
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-image:
    name: Production container & deployment syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validate deployment script
        run: |
          bash -n deploy/deploy.sh
          sh -n docker/railway-entrypoint.sh
      - name: Validate compose configuration
        env:
          DB_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-password
          REVERB_APP_KEY: ci-public-key
          VITE_REVERB_HOST: crm.example.invalid
        run: |
          cp backend/.env.example backend/.env
          docker compose -f docker/docker-compose.yml config --quiet
      - name: Build production PHP and Nginx images
        run: |
          docker build --target production --build-arg VITE_REVERB_APP_KEY=ci-public-key --build-arg VITE_REVERB_HOST=crm.example.invalid -f docker/Dockerfile -t aquaoptom:ci .
          docker build --target nginx --build-arg VITE_REVERB_APP_KEY=ci-public-key --build-arg VITE_REVERB_HOST=crm.example.invalid -f docker/Dockerfile -t aquaoptom-nginx:ci .
      - name: Verify runtime, assets and excluded secrets
        run: |
          docker run --rm aquaoptom:ci sh -c 'php artisan --version && php artisan reverb:start --help && test -f public/build/manifest.json && test ! -f .env && test ! -f .env.production'
          docker run --rm aquaoptom-nginx:ci sh -c 'test -f /var/www/html/public/build/manifest.json'
      - name: Build Railway combined web and API image
        run: docker build --target railway --build-arg VITE_REVERB_APP_KEY=ci-public-key -f docker/Dockerfile -t aquaoptom-railway:ci .
      - name: Verify Railway startup, persistence and WebSockets
        run: |
          docker network create aquaoptom-ci
          docker run -d --name railway-pg --network aquaoptom-ci -e POSTGRES_DB=aquaoptom_staging -e POSTGRES_PASSWORD=ci-only-password postgres:16-alpine
          docker run -d --name railway-redis --network aquaoptom-ci redis:7-alpine
          for attempt in $(seq 1 40); do docker exec railway-pg pg_isready -U postgres && break || sleep 1; done
          docker run -d --name railway-web --network aquaoptom-ci -p 127.0.0.1:18081:8080 \
            -e PORT=8080 -e APP_ENV=staging -e APP_DEBUG=false -e PREVIEW_MODE=true \
            -e APP_URL=http://127.0.0.1:18081 -e SESSION_SECURE_COOKIE=false -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=pgsql -e DB_HOST=railway-pg -e DB_PORT=5432 \
            -e DB_DATABASE=aquaoptom_staging -e DB_USERNAME=postgres -e DB_PASSWORD=ci-only-password \
            -e REDIS_CLIENT=predis -e REDIS_HOST=railway-redis -e CACHE_STORE=redis \
            -e SESSION_DRIVER=redis -e QUEUE_CONNECTION=redis -e LOG_CHANNEL=stderr \
            -e REVERB_APP_ID=ci-app -e REVERB_APP_KEY=ci-public-key -e REVERB_APP_SECRET=ci-only-secret \
            -e REVERB_HOST=127.0.0.1 -e REVERB_PORT=8081 -e REVERB_SCHEME=http \
            -e RAILWAY_INITIALIZE=true -e RAILWAY_OWNER_EMAIL=owner@preview.aquaoptom.test \
            -e RAILWAY_OWNER_PASSWORD=ci-only-password aquaoptom-railway:ci
          trap 'docker logs railway-web; docker rm -f railway-web railway-pg railway-redis' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18081/api/health/ready > /tmp/railway-ready.json && break || sleep 2
          done
          docker exec railway-web php artisan schedule:list --json > /tmp/railway-schedule.json
          python3 - <<'PY'
          import json, socket
          with open('/tmp/railway-schedule.json') as source:
              scheduled_tasks = json.load(source)
          assert any(task['description'] == 'telegram:retry-failed-deliveries' for task in scheduled_tasks), scheduled_tasks
          with open('/tmp/railway-ready.json') as source:
              readiness = json.load(source)
          assert readiness['status'] == 'READY', readiness
          assert 'notice' not in readiness['checks']['redis'], readiness
          with socket.create_connection(('127.0.0.1', 18081), timeout=10) as client:
              client.sendall(b'GET /app/ci-public-key?protocol=7&client=js&version=8.0.0 HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n')
              assert b'101 Switching Protocols' in client.recv(4096)
          print('Railway readiness and proxied Reverb handshake passed')
          PY
          curl -fsS http://127.0.0.1:18081/login > /tmp/railway-login.html
          grep -q 'Panelga kirish' /tmp/railway-login.html
          docker restart railway-web
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:18081/api/health/ready > /dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:18081/api/health/ready > /dev/null
          docker exec railway-web php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (App\Models\User::where("role", "OWNER")->count() !== 1 || App\Models\CashAccount::count() !== 1 || App\Models\CashAccount::sum("balance") != 0 || App\Models\Sale::count() !== 0 || App\Models\Product::count() !== 0) { exit(1); } echo "Restart preserved one owner, one empty cash account and zero business fixtures\n";'
          # This disposable loopback container has no Railway HTTPS edge proxy.
          # Keep the shipped Nginx template unchanged; override only this test instance.
          docker exec railway-web sh -c "sed -i 's/fastcgi_param HTTPS on;/fastcgi_param HTTPS off;/; s/fastcgi_param SERVER_PORT 443;/fastcgi_param SERVER_PORT 8080;/' /etc/nginx/nginx.conf && nginx -s reload"
          npm install --prefix "$RUNNER_TEMP/browser" --no-save playwright@1.63.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" PREVIEW_URL=http://127.0.0.1:18081 PREVIEW_OWNER_PASSWORD=ci-only-password BROWSER_SCENARIO=full node backend/tests/web-preview-ui.cjs
      - name: Save browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-ui-evidence
          path: ui-evidence/
          if-no-files-found: ignore
          retention-days: 7
